<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Purify POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen" class="login-wrapper">
        <div class="login-card">
            <h2>Purify POS</h2>
            <input type="text" id="loginUsername" class="input-field" placeholder="Username">
            <input type="password" id="loginPin" class="input-field" placeholder="PIN Akses">
            <button id="loginBtn" class="btn-primary">Masuk Aplikasi</button>
            <p id="loginMessage" style="color:red; font-size:12px;"></p>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <header class="app-header">
            <div class="brand-info"><h1>Purify Laundry</h1><span id="activeUserLabel"></span></div>
            <button id="logoutBtn" class="icon-btn">⎋</button>
        </header>

        <!-- DASHBOARD -->
        <div id="dashboardView" class="view-section active">
            <div class="dashboard-container">
                <h2 id="welcomeGreeting">Halo!</h2>
                <div id="financeCard" class="finance-card" style="display:none; background:#007770; color:white; padding:15px; border-radius:10px; margin-bottom:15px;">
                    <div style="display:flex; justify-content:space-between;">
                        <h3>📊 Ringkasan Keuangan</h3>
                        <button onclick="setSaldoAwal()">⚙️ Saldo Awal</button>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr;">
                        <div><p>Saldo Aktual</p><h2 id="saldoAktualTxt">Rp 0</h2></div>
                        <div><p>Saldo Proyeksi</p><h2 id="saldoProyeksiTxt">Rp 0</h2></div>
                    </div>
                </div>
                <div class="menu-grid">
                    <div class="menu-card" id="cardPos" onclick="switchView('posView')">🛒 Kasir</div>
                    <div class="menu-card" id="cardCashOut" onclick="switchView('cashOutView')">💸 Kas Keluar</div>
                    <div class="menu-card" id="cardHistory" onclick="switchView('historyView')">📋 Riwayat</div>
                    <div class="menu-card" id="cardFinance" onclick="switchView('dashboardView')">📊 Keuangan</div>
                    <div class="menu-card" id="cardAddService" onclick="openAddProductModal()">➕ Layanan</div>
                    <div class="menu-card" id="cardSettings" onclick="switchView('settingsView')">⚙️ Pengaturan</div>
                </div>
            </div>
        </div>

        <!-- HALAMAN LAIN -->
        <div id="posView" class="view-section" style="display:none;">...</div>
        <div id="cashOutView" class="view-section" style="display:none;">...</div>
        <div id="historyView" class="view-section" style="display:none;">...</div>
        <div id="settingsView" class="view-section" style="display:none;">
            <h2>Pengaturan Pengguna</h2>
            <button onclick="document.getElementById('addUserModal').style.display='flex'">+ Tambah User</button>
            <div id="userList"></div>
        </div>

        <!-- MODALS -->
        <div id="addUserModal" class="modal-overlay" style="display:none;">
            <div class="modal-card">
                <h3>Tambah Pengguna</h3>
                <input type="text" id="newUsername" placeholder="Username">
                <input type="number" id="newUserPin" placeholder="PIN">
                <select id="newUserRole"><option value="Kasir">Kasir</option><option value="Owner">Owner</option></select>
                <div id="permsContainer">
                    <label><input type="checkbox" class="perm-checkbox" value="pos"> POS</label>
                    <label><input type="checkbox" class="perm-checkbox" value="cash_out"> Kas Keluar</label>
                    <label><input type="checkbox" class="perm-checkbox" value="history"> Riwayat</label>
                </div>
                <button id="saveUserBtn">Simpan</button>
            </div>
        </div>
        <div id="editUserModal" class="modal-overlay" style="display:none;">...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
