<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Purify POS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007770">
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- Font Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LAYAR LOGIN -->
    <div id="loginScreen" class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">P</div>
            <h2>Purify POS</h2>
            <p>Sistem Manajemen Laundry</p>
            
            <input type="text" id="loginUsername" class="input-field" placeholder="Username">
            <input type="password" id="loginPin" class="input-field" placeholder="PIN Akses">
            
            <button id="loginBtn" class="btn-primary" style="margin-top: 10px;">Masuk Aplikasi</button>
            <p id="loginMessage" class="error-text"></p>
        </div>
    </div>

    <!-- APLIKASI UTAMA -->
    <div id="mainApp" style="display: none;">
        
        <!-- Header (Bilah Atas) -->
        <header class="app-header">
            <div class="brand-info">
                <h1>Purify Laundry</h1>
                <span id="activeUserLabel" class="user-badge">Kasir</span>
            </div>
            <div class="header-actions">
                <button id="addServiceBtn" class="icon-btn" title="Tambah Layanan">+</button>
                <button id="logoutBtn" class="icon-btn logout-btn" title="Keluar">⎋</button>
            </div>
        </header>

        <!-- Kategori (Scroll Horizontal) -->
        <div class="category-scroll">
            <button class="tab-btn active" data-category="Kiloan">Kiloan</button>
            <button class="tab-btn" data-category="Satuan">Satuan</button>
        </div>

        <!-- Area Katalog Produk -->
        <main class="product-area">
            <div class="product-grid" id="productGrid">
                <!-- Produk dirender JS -->
            </div>
        </main>

        <!-- FLOATING CART (Melayang di Bawah) -->
        <div id="floatingCart" class="floating-cart" style="display: none;">
            <div class="fc-info">
                <span id="fcItemCount" class="fc-count">0 Layanan</span>
                <span id="fcTotal" class="fc-total">Rp 0</span>
            </div>
            <button id="fcOpenBtn" class="fc-btn">Lihat Keranjang <span>›</span></button>
        </div>

        <!-- BOTTOM SHEET CHECKOUT (Meluncur dari bawah) -->
        <div id="checkoutOverlay" class="checkout-overlay"></div>
        <div id="checkoutSheet" class="bottom-sheet">
            <div class="sheet-header">
                <h2>Detail Pesanan</h2>
                <button id="closeSheetBtn" class="close-btn">✕</button>
            </div>
            
            <div class="sheet-body">
                <div class="cart-items" id="cartItems"></div>
                
                <div class="payment-section">
                    <h3>Data Pelanggan</h3>
                    <!-- Kolom Nama sekarang di atas, dilengkapi fitur pencarian (datalist) -->
                    <input type="text" id="customerName" class="input-field" placeholder="Nama Pelanggan (Ketik untuk cari...)" list="customerList" autocomplete="off">
                    <datalist id="customerList"></datalist>
                    
                    <!-- Kolom WA di bawah, yang akan terisi otomatis -->
                    <input type="tel" id="customerWA" class="input-field" placeholder="No. WhatsApp (Otomatis terisi)">
                    
                    <h3 style="margin-top: 15px;">Pembayaran</h3>
                    
                    <!-- KODE BARU: PILIHAN STATUS PEMBAYARAN -->
                    <div class="summary-row" style="margin-bottom: 12px;">
                        <span style="font-size: 13px; font-weight: 600; color: var(--text-main);">Status Pembayaran</span>
                        <select id="paymentStatus" class="input-field" style="width: 150px; margin-bottom: 0; padding: 8px; font-weight: 600; color: var(--primary);">
                            <option value="Lunas">Lunas</option>
                            <option value="Belum Lunas">Belum Lunas (Nanti)</option>
                        </select>
                    </div>

                    <div class="summary-row">
                        <span>Total Tagihan</span>
                        <span id="totalPrice" class="highlight-text">Rp 0</span>
                    </div>
                    <div class="summary-row input-row">
                        <span>Tunai / Bayar</span>
                        <div class="input-prefix">
                            <span>Rp</span>
                            <input type="number" id="cashGiven" placeholder="0">
                        </div>
                    </div>
                    <div class="summary-row divider">
                        <span>Kembalian</span>
                        <span id="changeAmount">Rp 0</span>
                    </div>
                </div>
            </div>
            
            <div class="sheet-footer">
                <button class="btn-primary" id="checkoutBtn">Selesaikan Transaksi</button>
            </div>
        </div>

        <!-- POP-UP TAMBAH LAYANAN (MODAL) -->
        <div id="addProductModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>Tambah Layanan</h3>
                <div class="input-group">
                    <label>Nama Layanan</label>
                    <input type="text" id="newProductName" placeholder="Cth: Cuci Jas">
                </div>
                <div class="input-group">
                    <label>Harga (Rp)</label>
                    <input type="number" id="newProductPrice" placeholder="Cth: 25000">
                </div>
                <div class="input-group">
                    <label>Kategori</label>
                    <select id="newProductCategory">
                        <option value="Kiloan">Cuci Kiloan</option>
                        <option value="Satuan">Cuci Satuan</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button id="cancelAddBtn" class="btn-text">Batal</button>
                    <button id="saveProductBtn" class="btn-primary-small">Simpan</button>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
