<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Purify POS System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="login-wrapper" style="display:flex;">
        <div class="login-card">
            <h2>Purify POS</h2>
            <input type="text" id="loginUsername" class="input-field" placeholder="Username">
            <input type="password" id="loginPin" class="input-field" placeholder="PIN Akses">
            <button id="loginBtn" class="btn-primary">Masuk Aplikasi</button>
            <p id="loginMessage" style="color:red; font-size:12px;"></p>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <header class="app-header">
            <div><h1>Purify Laundry</h1><span id="activeUserLabel"></span></div>
            <button id="logoutBtn">⎋</button>
        </header>

        <!-- DASHBOARD -->
        <div id="dashboardView" class="view-section">
            <h2 id="welcomeGreeting">Halo!</h2>
            <div id="financeCard" style="display:none; background:#007770; color:white; padding:15px; border-radius:10px;">
                <h3>📊 Ringkasan Keuangan</h3>
                <button onclick="window.setSaldoAwal()">⚙️ Saldo Awal</button>
                <div style="display:flex; justify-content:space-between;">
                    <div><p>Aktual</p><h2 id="saldoAktualTxt">Rp 0</h2></div>
                    <div><p>Proyeksi</p><h2 id="saldoProyeksiTxt">Rp 0</h2></div>
                </div>
            </div>
            <div class="menu-grid">
                <div class="menu-card" id="cardPos" onclick="window.switchView('posView')">🛒 Kasir</div>
                <div class="menu-card" id="cardCashOut" onclick="window.switchView('cashOutView')">💸 Kas Keluar</div>
                <div class="menu-card" id="cardHistory" onclick="window.switchView('historyView')">📋 Riwayat</div>
                <div class="menu-card" id="cardFinance" onclick="window.switchView('dashboardView')">📊 Keuangan</div>
                <div class="menu-card" id="cardAddService" onclick="window.openAddProductModal()">➕ Layanan</div>
                <div class="menu-card" id="cardSettings" onclick="window.switchView('settingsView')">⚙️ Pengaturan</div>
            </div>
        </div>

        <!-- HALAMAN LAINNYA -->
        <div id="posView" class="view-section" style="display:none;">... (Formulir Kasir Anda)</div>
        <div id="cashOutView" class="view-section" style="display:none;">... (Formulir Kas Keluar)</div>
        <div id="historyView" class="view-section" style="display:none;">... (Tabel Riwayat)</div>
        <div id="settingsView" class="view-section" style="display:none;">
            <h2>Pengaturan Pengguna</h2>
            <button onclick="document.getElementById('addUserModal').style.display='flex'">+ Tambah User</button>
            <div id="userList"></div>
        </div>

        <!-- MODALS -->
        <div id="addUserModal" class="modal-overlay" style="display:none;">...</div>
        <div id="editUserModal" class="modal-overlay" style="display:none;">...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
